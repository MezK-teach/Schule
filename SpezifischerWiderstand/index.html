<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Experiment zum spezifischen Widerstand</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0;
      padding: 0.7rem 1rem;
      text-align: center;
      font-size: clamp(1rem, 3vw, 1.5rem);
    }
    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 12px 12px;
    }
    #flash {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid #444;
    }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <h1>Experiment zum spezifischen Widerstand</h1>
  <main>
    <div id="flash" aria-label="Flash-Experiment zum spezifischen Widerstand"></div>
  </main>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("flash").appendChild(player);
      player.load("https://elsenbruch.info/ph9_down/spezwider.swf");
    });
  </script>
</body>
</html>
